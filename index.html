<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web design demos</title>
<style>
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#f6f4ef;
    color:#2a2a28;
    padding:64px 24px;
  }
  .wrap{max-width:640px;margin:0 auto;}
  h1{font-size:28px;margin-bottom:8px;}
  p{color:#5a5a56;line-height:1.6;}
  ul{list-style:none;padding:0;margin-top:32px;}
  li{margin-bottom:14px;}
  a.demo-link{
    display:block;
    padding:16px 20px;
    background:#fff;
    border:1px solid #e0ddd3;
    border-radius:8px;
    text-decoration:none;
    color:#2a2a28;
    font-weight:600;
    transition:border-color .15s ease;
  }
  a.demo-link:hover{border-color:#b94e2e;}
  a.demo-link span{
    display:block;
    font-weight:400;
    font-size:14px;
    color:#8a8680;
    margin-top:4px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Web design demos</h1>
  <p>Concept sites built for local Tulsa-metro businesses currently without a real website.</p>
  <ul>
    <li>
      <a class="demo-link" href="./crescent-cafe/">
        Crescent Cafe
        <span>Sand Springs, OK &middot; diner &middot; demo site</span>
      </a>
    </li>
  </ul>
</div>
</body>
</html>
